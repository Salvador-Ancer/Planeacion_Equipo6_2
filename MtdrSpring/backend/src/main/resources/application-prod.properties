# Perfil de producción — sobreescribe application.properties
# Actívalo con: -Dspring.profiles.active=prod  (o variable SPRING_PROFILES_ACTIVE=prod)

# Logging estructurado en JSON para OCI Logging / ELK
logging.level.root=WARN
logging.level.oracle.ucp=WARN
logging.level.org.hibernate=WARN
logging.structured.format.console=ecs
logging.file.name=/var/log/app/app.log
logging.structured.format.file=ecs
