spring.jpa.database-platform=org.hibernate.community.dialect.Oracle12cDialect

# -------------------------------------------------------
# Datasource — todos los valores vienen de env vars.
# Para desarrollo local crea un archivo .env o exporta
# las variables antes de arrancar la aplicación.
# -------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver_class_name=oracle.jdbc.OracleDriver
spring.datasource.tns-admin=${TNS_ADMIN_PATH}

spring.datasource.oracleucp.url=${DB_URL}
spring.datasource.oracleucp.user=${DB_USER}
spring.datasource.oracleucp.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# UCP connection pool
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=connectionPoolName1
spring.datasource.oracleucp.initial-pool-size=5
spring.datasource.oracleucp.min-pool-size=5
spring.datasource.oracleucp.max-pool-size=20

# -------------------------------------------------------
# Logging — nivel INFO por defecto.
# Para debug local usa: logging.level.root=DEBUG
# El perfil "prod" sobreescribe con WARN (ver application-prod.properties)
# -------------------------------------------------------
logging.level.root=INFO
logging.level.oracle.ucp=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN

# -------------------------------------------------------
# APIs externas — vienen de env vars
# -------------------------------------------------------
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}
anthropic.api.key=${ANTHROPIC_API_KEY:}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.name=${TELEGRAM_BOT_NAME:koookkii_bot}

# RAG Engine — ORDS + Groq
ords.base.url=${ORDS_BASE_URL}
ords.password=${ATP_PASSWORD}
groq.api.key=${GROQ_API_KEY}

# -------------------------------------------------------
# Spring / Swagger
# -------------------------------------------------------
springdoc.swagger-ui.disable-swagger-default-url=true
server.forward-headers-strategy=framework

# JWT — secreto para firmar tokens (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET}

# Spring Boot Actuator — health checks para Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

