# ============================================================
# Perfil LOCAL — H2 en memoria, sin Oracle, sin Telegram
# Usar con: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================

# H2 en memoria (OracleConfiguration excluida por @Profile("!local"))
spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS ADMIN
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.oracleucp.url=
spring.datasource.oracleucp.user=
spring.datasource.oracleucp.password=
spring.datasource.oracleucp.connection-factory-class-name=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging legible en consola
logging.level.root=INFO
logging.level.com.springboot=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT — secreto local (cualquier string de 32+ chars sirve)
jwt.secret=local-dev-secret-minimo-32-caracteres-ok

# Telegram desactivado (ToDoItemBotController excluido por @Profile)
telegram.bot.token=disabled
telegram.bot.name=disabled

# APIs de IA — vacías; solo fallan si se llaman, no al arrancar
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.key=
anthropic.api.key=
groq.api.key=
ords.base.url=http://localhost
ords.password=disabled
