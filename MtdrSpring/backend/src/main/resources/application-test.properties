# Perfil de tests — usa H2 en memoria para no requerir Oracle en CI
# Actívalo con: -Dspring.profiles.active=test  (o SPRING_PROFILES_ACTIVE=test)

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Sobreescribe el tipo UCP (no compatible con H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactiva UCP para tests
spring.datasource.oracleucp.url=
spring.datasource.oracleucp.user=
spring.datasource.oracleucp.password=

# Logging mínimo en tests
logging.level.root=WARN
logging.level.com.springboot=INFO

# Deshabilitar bot Telegram en tests (evita conexión real)
telegram.bot.token=test-token-ci
telegram.bot.name=test-bot
