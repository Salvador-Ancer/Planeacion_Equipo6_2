# Perfil de tests — usa H2 en memoria para no requerir Oracle en CI
# Actívalo con: -Dspring.profiles.active=test  (o SPRING_PROFILES_ACTIVE=test)

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS ADMIN
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP en tests (OracleConfiguration excluido por @Profile("!test"))
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.oracleucp.url=
spring.datasource.oracleucp.user=
spring.datasource.oracleucp.password=
spring.datasource.oracleucp.connection-factory-class-name=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging mínimo en tests
logging.level.root=WARN
logging.level.com.springboot=INFO

# Deshabilitar bot Telegram en tests (evita conexión real)
telegram.bot.token=test-token-ci
telegram.bot.name=test-bot

# JWT con secreto fijo para tests (no exponer en producción)
jwt.secret=test-secret-fijo-para-ci-minimo-32-chars-ok
