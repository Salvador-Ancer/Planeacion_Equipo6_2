apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app: todolistapp-springboot
---
#this is new stuff for hosting on the load balancer
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 2
  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: "%DOCKER_REGISTRY%/todolistapp-springboot:0.1"
          imagePullPolicy: Always
          env:
            # Variables no sensibles
            - name: DB_URL
              value: "jdbc:oracle:thin:@reacttodoukcyd_medium?TNS_ADMIN=/mtdrworkshop/creds"
            - name: TNS_ADMIN_PATH
              value: "/mtdrworkshop/creds"
            - name: OCI_REGION
              value: "%OCI_REGION%"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # Secretos — vienen del Secret "app-secrets"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: telegram-bot-token
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq-api-key
            - name: ATP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: ORDS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ords-base-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot
---
# HorizontalPodAutoscaler — escala entre 2 y 5 réplicas según CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todolistapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todolistapp-springboot-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Secret template — crear con:
#   kubectl create secret generic app-secrets \
#     --from-literal=db-user=ADMIN \
#     --from-literal=db-password=<password> \
#     --from-literal=telegram-bot-token=<token> \
#     --from-literal=groq-api-key=<key> \
#     --from-literal=ords-base-url=<url>
#
# Este bloque es solo referencia; NO almacena valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  db-user: "${DB_USER}"
  db-password: "${DB_PASSWORD}"
  telegram-bot-token: "${TELEGRAM_BOT_TOKEN}"
  groq-api-key: "${GROQ_API_KEY}"
  ords-base-url: "${ORDS_BASE_URL}"