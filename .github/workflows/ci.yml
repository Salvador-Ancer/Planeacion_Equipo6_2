name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Tests de backend (JUnit 5 + Spring Boot Test)
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        working-directory: MtdrSpring/backend
        env:
          # Variables mínimas para que Spring Boot arranque en test
          DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          DB_USER: sa
          DB_PASSWORD: ""
          TNS_ADMIN_PATH: /tmp
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_BOT_NAME: test-bot
          DEEPSEEK_API_KEY: test-key
          GROQ_API_KEY: test-key
          ATP_PASSWORD: test-pass
          ORDS_BASE_URL: http://localhost
          SPRING_PROFILES_ACTIVE: test
        run: mvn test -pl . --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: MtdrSpring/backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: MtdrSpring/backend/target/site/jacoco/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Lint (ya existente, integrado aquí)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super Linter
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Build Docker image (solo verifica que compila; no hace push)
  # Se ejecuta solo en main después de que pasen los tests
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sin push)
        uses: docker/build-push-action@v5
        with:
          context: MtdrSpring/backend
          file: MtdrSpring/backend/Dockerfile
          push: false
          tags: todolistapp-springboot:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
