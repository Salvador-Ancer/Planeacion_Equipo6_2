version: 0.1
component: build
timeoutInSeconds: 1800
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH;
             java -version

  - type: Command
    name: "Docker Login"
    command: cd MtdrSpring;
             oci os object get --bucket-name reacttodo-ukcyd --name deployment_config.tgz --file deployment_config.tgz;
             tar -xzvf deployment_config.tgz;
             source env.sh;
             cat at.cfg | docker login -u "axe5wdod0see/a00840038@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command
    name: "Install K8s"
    command: mkdir -p $HOME/.kube;
             cd $HOME;
             mkdir -p k8s;
             cd k8s;
             wget https://dl.k8s.io/v1.31.2/bin/linux/amd64/kubectl;
             chmod +x kubectl;
             export PATH=$PATH:$HOME/k8s;
             kubectl version --client;
             cd $HOME/.kube;
             oci ce cluster create-kubeconfig --cluster-id ocid1.cluster.oc1.mx-queretaro-1.aaaaaaaaeeklnmbx6fajnmf645x2w5eyjsenc5qzocfj4ovxycy6mwf7apkq --file $HOME/.kube/config --region mx-queretaro-1 --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT;
             export KUBECONFIG=$HOME/.kube/config;

  - type: Command
    name: "Undeploy"
    ignoreFailure: True
    command: export PATH=$PATH:$HOME/k8s;
             export KUBECONFIG=$HOME/.kube/config;
             cd MtdrSpring;
             source env.sh;
             cd backend;
             kubectl config view;
             source undeploy.sh;

  - type: Command
    name: "Maven Build"
    command: cd MtdrSpring/backend;
             export JAVA_HOME=/usr/lib/jvm/java-17-openjdk;
             export PATH=$JAVA_HOME/bin:$PATH;
             java -version;
             ./mvnw package -DskipTests

  - type: Command
    name: "Build"
    command: export PATH=/usr/lib/jvm/java-17-openjdk/bin:$PATH;
             cd MtdrSpring;
             source env.sh;
             (cd backend; source build.sh)

  - type: Command
    name: "Deploy to OKE"
    command: |
      export PATH=$PATH:$HOME/k8s
      export KUBECONFIG=$HOME/.kube/config
      cd MtdrSpring
      source env.sh
      cd backend
      source deploy.sh
      echo "Waiting for rollout to complete..."
      kubectl rollout status deployment/todolistapp-springboot-deployment -n mtdrworkshop --timeout=300s

  - type: Command
    name: "Get LoadBalancer External IP"
    command: |
      export PATH=$PATH:$HOME/k8s
      export KUBECONFIG=$HOME/.kube/config
      echo "Waiting for LoadBalancer IP..."
      for i in $(seq 1 30); do
        LB_IP=$(kubectl get svc todolistapp-springboot-service -n mtdrworkshop -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
        if [ -n "$LB_IP" ]; then
          echo "LoadBalancer IP: $LB_IP"
          echo "export LB_IP=$LB_IP" > $HOME/jmeter_env.sh
          break
        fi
        echo "Attempt $i/30 - not yet assigned, waiting 10s..."
        sleep 10
      done
      if [ -z "$LB_IP" ]; then
        echo "ERROR: LoadBalancer IP not assigned after 300s"
        exit 1
      fi

  - type: Command
    name: "Verify App Health"
    command: |
      source $HOME/jmeter_env.sh
      echo "Verifying app health at http://$LB_IP/proyectos ..."
      for i in $(seq 1 12); do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://$LB_IP/proyectos || echo "000")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "App is healthy (HTTP $HTTP_CODE)"
          break
        fi
        echo "Attempt $i/12 - HTTP $HTTP_CODE, waiting 15s..."
        sleep 15
      done
      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: App did not respond HTTP 200 after 180s"
        exit 1
      fi

  - type: Command
    name: "Install Apache JMeter 5.6.3"
    command: |
      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
      export PATH=$JAVA_HOME/bin:$PATH
      cd $HOME
      wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
      tar -xzf apache-jmeter-5.6.3.tgz
      export JMETER_HOME=$HOME/apache-jmeter-5.6.3
      export PATH=$JMETER_HOME/bin:$PATH
      JAVA_HOME=$JAVA_HOME jmeter --version
      echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk" >> $HOME/jmeter_env.sh
      echo "export JMETER_HOME=$HOME/apache-jmeter-5.6.3" >> $HOME/jmeter_env.sh
      echo 'export PATH=$JAVA_HOME/bin:$JMETER_HOME/bin:$PATH' >> $HOME/jmeter_env.sh

  - type: Command
    name: "Seed Test Users"
    command: |
      source $HOME/jmeter_env.sh
      echo "Registering JMeter test users via /auth/register ..."
      for USER in admin dev1 dev2 dev3 dev4 dev5 qa; do
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://$LB_IP/auth/register \
          -H "Content-Type: application/json" \
          -d "{\"email\":\"$USER@test.com\",\"password\":\"Test1234!\",\"fullName\":\"$USER\",\"rol\":\"Developer\"}")
        echo "Register $USER@test.com: HTTP $HTTP_CODE"
      done
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://$LB_IP/auth/register \
        -H "Content-Type: application/json" \
        -d '{"email":"pm@test.com","password":"Test1234!","fullName":"PM","rol":"Manager"}')
      echo "Register pm@test.com: HTTP $HTTP_CODE"
      echo "Test user seeding complete"

  - type: Command
    name: "Run JMeter - Baseline (10 users)"
    command: |
      source $HOME/jmeter_env.sh
      mkdir -p /root/jmeter-results/baseline /root/jmeter-results/html/baseline
      cd tests/jmeter
      jmeter -n \
        -t load_test.jmx \
        -l /root/jmeter-results/baseline/results.jtl \
        -e -o /root/jmeter-results/html/baseline \
        -Jhost=$LB_IP -Jport=80 \
        -Jthreads=10 -Jread_threads=8 -Jwrite_threads=2 \
        -Jrampup=30 -Jduration=180 -Jthinktime=1000 \
        -Jemail=dev1@test.com -Jpassword=Test1234!
      echo "Baseline run complete"

  - type: Command
    name: "Run JMeter - Normal Load (25 users)"
    command: |
      source $HOME/jmeter_env.sh
      mkdir -p /root/jmeter-results/normal /root/jmeter-results/html/normal
      cd tests/jmeter
      jmeter -n \
        -t load_test.jmx \
        -l /root/jmeter-results/normal/results.jtl \
        -e -o /root/jmeter-results/html/normal \
        -Jhost=$LB_IP -Jport=80 \
        -Jthreads=25 -Jread_threads=20 -Jwrite_threads=5 \
        -Jrampup=60 -Jduration=300 -Jthinktime=1000 \
        -Jemail=dev2@test.com -Jpassword=Test1234!
      echo "Normal load run complete"

  - type: Command
    name: "Run JMeter - Peak Load (50 users)"
    command: |
      source $HOME/jmeter_env.sh
      mkdir -p /root/jmeter-results/peak /root/jmeter-results/html/peak
      cd tests/jmeter
      jmeter -n \
        -t load_test.jmx \
        -l /root/jmeter-results/peak/results.jtl \
        -e -o /root/jmeter-results/html/peak \
        -Jhost=$LB_IP -Jport=80 \
        -Jthreads=50 -Jread_threads=40 -Jwrite_threads=10 \
        -Jrampup=90 -Jduration=300 -Jthinktime=1000 \
        -Jemail=dev3@test.com -Jpassword=Test1234!
      echo "Peak load run complete"

  - type: Command
    name: "Run JMeter - Stress Test (100 users)"
    ignoreFailure: True
    command: |
      source $HOME/jmeter_env.sh
      mkdir -p /root/jmeter-results/stress /root/jmeter-results/html/stress
      cd tests/jmeter
      jmeter -n \
        -t load_test.jmx \
        -l /root/jmeter-results/stress/results.jtl \
        -e -o /root/jmeter-results/html/stress \
        -Jhost=$LB_IP -Jport=80 \
        -Jthreads=100 -Jread_threads=80 -Jwrite_threads=20 \
        -Jrampup=120 -Jduration=180 -Jthinktime=500 \
        -Jemail=dev4@test.com -Jpassword=Test1234!
      echo "Stress test complete"

  - type: Command
    name: "Package JMeter Results"
    command: |
      cd /root
      tar -czf jmeter-reports.tar.gz jmeter-results/
      echo "Reportes empaquetados en: /root/jmeter-reports.tar.gz"

  - type: Command
    name: "Validate Acceptance Criteria (Peak)"
    command: |
      source $HOME/jmeter_env.sh
      RESULTS=/root/jmeter-results/peak/results.jtl
      if [ ! -f "$RESULTS" ]; then
        echo "ERROR: Peak results not found"
        exit 1
      fi
      echo "--- Errores por endpoint (label) y codigo de respuesta ---"
      awk -F',' 'NR>1 && $8=="false" { print $3, $4 }' $RESULTS | sort | uniq -c | sort -rn
      echo "-----------------------------------------------------------"
      awk -F',' '
        NR>1 { total++; if ($8=="false") errors++ }
        END {
          rate = (total>0) ? errors*100/total : 0
          printf "Total samples: %d | Errors: %d | Error rate: %.2f%%\n", total, errors, rate
          if (rate > 5) {
            printf "FAIL: Error rate %.2f%% supera umbral 5%%\n", rate
            exit 1
          }
          printf "PASS: Error rate %.2f%% dentro del umbral 5%%\n", rate
        }
      ' $RESULTS

outputArtifacts:
  - name: jmeter-baseline-report
    type: BINARY
    location: /root/jmeter-results/html/baseline/index.html
  - name: jmeter-normal-report
    type: BINARY
    location: /root/jmeter-results/html/normal/index.html
  - name: jmeter-peak-report
    type: BINARY
    location: /root/jmeter-results/html/peak/index.html
  - name: jmeter-stress-report
    type: BINARY
    location: /root/jmeter-results/html/stress/index.html
  - name: jmeter-all-reports
    type: BINARY
    location: /root/jmeter-reports.tar.gz